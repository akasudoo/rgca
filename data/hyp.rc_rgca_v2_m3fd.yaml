# RC-RGCA v2 full-M3FD protocol. Detection hyperparameters match the original
# 200-epoch C0 RGCA run; only reliability-specific training keys are added.
lr0: 0.01
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

# Reliability curriculum: corrupt one modality more often than both so source
# quality is identifiable; pair corruption teaches the correspondence term.
reliability_corruption_probability: 0.70
reliability_pair_corruption_probability: 0.12
reliability_modality_dropout_probability: 0.06
reliability_max_shift_fraction: 0.045
reliability_aux_gain: 0.15
reliability_local_gain: 0.50
reliability_ranking_gain: 0.25
