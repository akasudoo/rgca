# COCO 2017 dataset http://cocodataset.org - first 128 training images
# Train command: python train.py --data coco128.yaml
# Default dataset location is next to YOLOv5:
#   /parent_folder
#     /coco128
#     /yolov5


# download command/URL (optional)
#download: https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip

# train and val data as 1) directory: path/images/, 2) file: path/images.txt, or 3) list: [path1/images/, path2/images/]
# Native ext4 copy. The original dataset under /home/dell/lcp (a /mydata
# NTFS/FUSE mount) is intentionally retained as a read-only fallback.
path: /home/dell/datasets_native/FLIR
train_rgb: /home/dell/datasets_native/FLIR/images/vis_train  # 4118 images
val_rgb: /home/dell/datasets_native/FLIR/images/vis_test  # 1010 images
train_ir: /home/dell/datasets_native/FLIR/images/ir_train  # 4118 images
val_ir: /home/dell/datasets_native/FLIR/images/ir_test  # 1010 images

# number of classes
nc: 3

# class names
names: ['person', 'car', 'bicycle']
