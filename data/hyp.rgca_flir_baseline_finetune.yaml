# Uniform-LR fine-tuning of C0 RGCA + foreground mask-guided GFB on FLIR.
# LCAFNet_FLIR.pt initializes the complete dual-stream backbone, PAN/Detect and
# compatible GFB tensors. New RGCA/mask tensors and loaded tensors are jointly
# optimized with a fresh Adam optimizer; this is not checkpoint resume.
lr0: 0.0005
lrf: 0.1
momentum: 0.9  # Adam beta1 (beta2 is fixed to 0.999 in train.py)
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.0005
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
