# Parameter-efficient channel-prior + detection-head fine-tuning.
lr0: 0.001
lrf: 0.10
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.5
warmup_momentum: 0.8
warmup_bias_lr: 0.001

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

# Very weak augmentation protects the converged exp_mask representation.
hsv_h: 0.005
hsv_s: 0.20
hsv_v: 0.15
degrees: 0.0
translate: 0.02
scale: 0.10
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
