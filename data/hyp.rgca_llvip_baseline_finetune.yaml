# Two-stage fine-tuning of RGCA + foreground mask-guided GFB on aligned LLVIP.
# LLVIP is already geometrically aligned; avoid independent color/geometric
# transforms that could introduce artificial RGB/IR misalignment.
lr0: 0.0005
lrf: 0.1
momentum: 0.9  # Adam beta1 (beta2 is fixed to 0.999 in train.py)
weight_decay: 0.00005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.0005
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
