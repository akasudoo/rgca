# Conservative 1024x1024 fine-tuning of the converged LLVIP C0 RGCA best.pt.
# Source and target are exactly the same one-class architecture.  Keep paired
# geometry/appearance unchanged; only synchronized horizontal flipping remains
# active until train.py closes every augmentation for the final five epochs.

lr0: 0.00002
lrf: 0.7
momentum: 0.937
weight_decay: 0.00005
warmup_epochs: 0.0
warmup_momentum: 0.8
warmup_bias_lr: 0.00002

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0

# Auditable protocol marker; no reliability corruption/auxiliary loss is used.
llvip_rgca_same_architecture_finetune: true
