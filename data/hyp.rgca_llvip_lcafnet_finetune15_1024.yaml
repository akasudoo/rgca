# 1024x1024 transfer fine-tuning from original LCAFNet_LLVIP.pt to the
# C0 RGCA+Mask+GFB detector.  This reproduces the local configuration that
# reached 0.976898 mAP50 at epoch 7, but limits the run to 15 epochs because
# the historical 50-epoch run began to overfit after its early peak.

lr0: 0.002
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0

# Paired augmentations are applied synchronously by the multispectral loader.
hsv_h: 0.01
hsv_s: 0.4
hsv_v: 0.3
degrees: 0.0
translate: 0.05
scale: 0.2
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.5
mixup: 0.0

llvip_lcafnet_to_rgca_finetune: true
