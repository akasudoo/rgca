# Strict Group-D 50-epoch BECP fine-tuning from the converged no-prior M3FD
# best.pt. Epochs 0-4 update only the evidence controller at LR 0.01 with an
# exactly-zero prior. Epochs 5-14 ramp the prior while joint tuning uses
# backbone/fusion/controller LRs 0.0002/0.0004/0.002. AFSS remains disabled.
