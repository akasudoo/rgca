# AdamW schedule for the repaired frequency/channel/spatial prior model.
# Prior parameters use their own zero-decay optimizer group in train.py.
lr0: 0.0003
lrf: 0.05
momentum: 0.90
weight_decay: 0.001
warmup_epochs: 5.0
warmup_momentum: 0.70
warmup_bias_lr: 0.0001

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
