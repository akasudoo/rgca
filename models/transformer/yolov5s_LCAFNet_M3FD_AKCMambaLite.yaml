# M3FD experimental detector: restored no-prior RGCA fusion plus an
# AKCMamba-YOLO-inspired lightweight PAN output neck.
# Only layers 38/41/44 differ from yolov5s_LCAFNet_M3FD.yaml so the dual
# YOLOv5s backbone transfer and the established fusion path remain unchanged.

nc: 6
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [5,6, 8,14, 15,11]
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   # Keep the exact best-run no-prior RGCA + foreground mask + GFB path.
   [[2,12], 1, HAFFormerRGCAMaskGFB, [128, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [[4,14], 1, HAFFormerRGCAMaskGFB, [256, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [[6,16], 1, HAFFormerRGCAMaskGFB, [512, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [[9,19], 1, HAFFormerRGCAMaskGFB, [1024, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]]]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 22], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 21], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 20], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],  # 35: P2/4 unchanged

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 32], 1, Concat, [1]],
   [-1, 3, C3AKCMambaLite, [256, True, 5, 0.5, 0.25]],  # 38: P3/8

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 28], 1, Concat, [1]],
   [-1, 3, C3AKCMambaLite, [512, True, 5, 0.5, 0.25]],  # 41: P4/16

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 24], 1, Concat, [1]],
   [-1, 3, C3AKCMambaLite, [1024, True, 5, 0.5, 0.25]],  # 44: P5/32

   [[35, 38, 41, 44], 1, Detect, [nc, anchors]]]
