# C4 revised lightweight RGB-IR detector: C1 + D3C3 Slim-PAN.
#
# The complete C1 backbone is retained: independent RGB/IR extraction through
# C3, fusion at C2/C3, then one shared C4/C5.  Only the six PAN C3 aggregation
# blocks are replaced by YOLOv5-compatible D3C3 blocks.  There are no C2/C3
# private bypasses, auxiliary losses, RepDown, Mamba, or distillation.

nc: 6
depth_multiple: 0.33
width_multiple: 0.50
architecture_variant: c4_c1_d3c3_slim_pan
d3_kernel_size: 7

pretrained_backbone_map:
  0: 0
  1: 1
  2: 2
  3: 3
  4: 4
  5: 0
  6: 1
  7: 2
  8: 3
  9: 4
  12: 5
  13: 6
  14: 7
  15: 8
  16: 9

anchors:
  - [5,6, 8,14, 15,11]
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],                 # 4: RGB C3 / stride 8

   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],                 # 9: IR C3 / stride 8

   [[2,7], 1, HAFFormerRGCAMaskGFB,
    [128, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [[4,9], 1, HAFFormerRGCAMaskGFB,
    [256, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],                 # 13: shared C4 / stride 16
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],           # 16: shared C5 / stride 32
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 13], 1, Concat, [1]],
   [-1, 3, D3C3, [512, True, 1, 0.5, 7]],

   [-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 11], 1, Concat, [1]],
   [-1, 3, D3C3, [512, True, 1, 0.5, 7]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 10], 1, Concat, [1]],
   [-1, 3, D3C3, [256, True, 1, 0.5, 7]],  # 28: P2 / stride 4

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 25], 1, Concat, [1]],
   [-1, 3, D3C3, [256, True, 1, 0.5, 7]],  # 31: P3 / stride 8

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 21], 1, Concat, [1]],
   [-1, 3, D3C3, [512, True, 1, 0.5, 7]],  # 34: P4 / stride 16

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 17], 1, Concat, [1]],
   [-1, 3, D3C3, [1024, True, 1, 0.5, 7]], # 37: P5 / stride 32

   [[28, 31, 34, 37], 1, Detect, [nc, anchors]]]
