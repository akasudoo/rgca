# C2 lightweight RGB-IR detector: C1 + modality-private low-rank bypasses.
#
# The main path is exactly C1: independent RGB/IR extraction through C3,
# fusion at C3, and one shared C4/C5 backbone. One persistent, packed private
# state carries separate RGB/IR evidence alongside C4/C5 in rank-16 space.

nc: 6
depth_multiple: 0.33
width_multiple: 0.50
architecture_variant: c2_c1_private_low_rank_c4_c5
private_bypass_rank: 16

# C2 private layers (14, 15, 19 and 20) are new. Every unchanged C1 layer is
# initialized from the same canonical YOLOv5s backbone stage.
pretrained_backbone_map:
  0: 0
  1: 1
  2: 2
  3: 3
  4: 4
  5: 0
  6: 1
  7: 2
  8: 3
  9: 4
  12: 5
  13: 6
  16: 7
  17: 8
  18: 9

anchors:
  - [5,6, 8,14, 15,11]
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  # RGB branch through C3.
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],                 # 2: RGB C2 / stride 4
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],                 # 4: RGB C3 / stride 8

   # IR branch through C3.
   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],                 # 7: IR C2 / stride 4
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],                 # 9: IR C3 / stride 8

   [[2,7], 1, HAFFormerRGCAMaskGFB,
    [128, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],
   [[4,9], 1, HAFFormerRGCAMaskGFB,
    [256, 1.0, 2, 1.0, none, 0.5, 0.1, 0.01, legacy_channel]],

   # Build one packed but group-isolated RGB/IR rank-16 state at C4.
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],                 # 13: unmodified shared C4
   [[4,9], 1, ModalityPrivateLowRankStem, [16, 1]],
   [[13,14], 1, ModalityPrivateLowRankInject, [0.1]],

   # The private state advances independently; it never enters shared C4/C5.
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],           # 18: unmodified shared C5
   [14, 1, ModalityPrivateLowRankDownsample, []],
   [[18,19], 1, ModalityPrivateLowRankInject, [0.1]],
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],         # 21
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 15], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],          # 24: PAN P4

   [-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 11], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],          # 28: PAN P3

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 10], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],          # 32: P2 / stride 4

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 29], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],          # 35: P3 / stride 8

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 25], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],          # 38: P4 / stride 16

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 21], 1, Concat, [1]],
   [-1, 3, C3, [1024, False]],         # 41: P5 / stride 32

   [[32, 35, 38, 41], 1, Detect, [nc, anchors]]]
