# M3FD C0 full-dual detector: the trained BECP/RGCA/mask/GFB model plus
# SOD-YOLO Attentional Scale Sequence Fusion on the P2/P3 Detect inputs.
nc: 6
depth_multiple: 0.33
width_multiple: 0.50
architecture_variant: c0_full_dual_becp_sod_asf

anchors:
  - [5,6, 8,14, 15,11]
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   # The four trained BECP/RGCA/mask/GFB fusion levels remain unchanged.
   [[2,12], 1, HAFFormerBECPMaskGFB, [128, 1.0, 2, 0.5]],
   [[4,14], 1, HAFFormerBECPMaskGFB, [256, 1.0, 2, 0.5]],
   [[6,16], 1, HAFFormerBECPMaskGFB, [512, 1.0, 2, 0.5]],
   [[9,19], 1, HAFFormerBECPMaskGFB, [1024, 1.0, 2, 0.5]],
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 22], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 21], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 20], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],           # 35: PAN P2/4

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 32], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],           # 38: PAN P3/8

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 28], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],           # 41: PAN P4/16

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 24], 1, Concat, [1]],
   [-1, 3, C3, [1024, False]],          # 44: PAN P5/32

   # SOD-YOLO ASF enriches only the two small-object prediction levels.
   [[21, 22, 23], 1, SODScaleSequenceFusion, [256]],  # 45: P3 context
   [[38, 45], 1, SODResidualAdd, [0.0]],              # 46: enhanced P3
   [[20, 21, 22], 1, SODScaleSequenceFusion, [256]],  # 47: P2 context
   [[35, 47], 1, SODResidualAdd, [0.0]],              # 48: enhanced P2

   [[48, 46, 41, 44], 1, Detect, [nc, anchors]],      # 49: HBB P2-P5
  ]
